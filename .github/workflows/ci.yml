name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install -U pip wheel setuptools
          # Torch CPU wheel (works on GitHub runners)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # App + test deps (explicit to avoid build-backend issues)
          pip install fastapi "uvicorn[standard]" pydantic numpy "scikit-learn>=1.3,<1.6" sentence-transformers httpx
          pip install pytest ruff black

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Test
        run: pytest -q
