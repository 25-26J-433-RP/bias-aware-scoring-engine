name: ci
on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HOME: /home/runner/.cache/huggingface
      TRANSFORMERS_CACHE: /home/runner/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /home/runner/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      DISABLE_ML: "1"


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('**/scorer.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install deps
        run: |
          python -m pip install -U pip wheel setuptools
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi "uvicorn[standard]" pydantic numpy "scikit-learn>=1.3,<1.6" sentence-transformers httpx
          pip install pandas requests firebase-admin scipy tqdm slowapi
          pip install pytest ruff black

      - name: Pre-download sentence-transformers model
        run: |
          python - <<'PY'
          from sentence_transformers import SentenceTransformer
          SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
          print("Model cached.")
          PY

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          ruff check .
          black --check .

      - name: Run tests
        run: |
          export DISABLE_ML=1
          pytest -q

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bias-aware-scoring-engine:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bias-aware-scoring-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
