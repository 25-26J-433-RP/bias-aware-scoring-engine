[project]
name = "bias-aware-scoring-engine"
version = "0.1.0"
description = "FastAPI microservice for content-focused essay scoring with fairness reporting (Phase 1)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sentence-transformers>=2.7.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pandas>=2.0.0",
  "requests>=2.31.0",
  "firebase-admin>=6.5.0",
  "scipy>=1.11.0",
  "tqdm>=4.66.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP"]
