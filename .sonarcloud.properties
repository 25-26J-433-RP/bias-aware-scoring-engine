# SonarCloud configuration for bias-aware-scoring-engine

# Exclude test files and temporary outputs from analysis
sonar.exclusions=**/test_*.py,**/*_test.py,**/tests/**,**/*.txt,**/*.json

# Python-specific settings
sonar.python.version=3.11

# Security hotspot: Binding to 0.0.0.0 is required for Cloud Run/Docker deployment
# This is intentional and controlled via HOST environment variable
sonar.issue.ignore.multicriteria=e1

sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4507
sonar.issue.ignore.multicriteria.e1.resourceKey=**/main.py
